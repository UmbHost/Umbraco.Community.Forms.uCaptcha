name: Package up Prerelease.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:

  build:
    runs-on: windows-latest
    # runs-on: self-hosted
    
    env:
      CONFIG: 'Release'
      SOLUTION_FILE: './Umbraco.Community.Forms.uCaptcha.sln'
      OUT_FOLDER: './build.out/'

    steps:

      - name: Setup dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            10.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.12.0
        with:
          versionSpec: '5.x'

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Determine Version with GitVersion (MSBuild in Proj will do this)
        id:   gitversion
        uses: gittools/actions/gitversion/execute@v0.9.15
        with:
          useConfigFile: true
          configFilePath: ./GitVersion.yml

      - name: Display GitVersion SemVer
        run: |
          echo "FullSemVer: ${{ steps.gitversion.outputs.nuGetVersionV2 }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./Umbraco.Community.Forms.uCaptcha/Client/package-lock.json
      
      - name: Update package.json version
        uses: jossef/action-set-json-field@v2.2
        with:
          file:  Umbraco.Community.Forms.uCaptcha/Client/package.json
          field: version
          value: ${{ steps.gitversion.outputs.semVer }}
      
      - run: npm ci
        working-directory: ./Umbraco.Community.Forms.uCaptcha/Client/

      - run: npm run build
        working-directory: ./Umbraco.Community.Forms.uCaptcha/Client/

      - name: Retrieve cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-umbcheckout


      - name: Update umbraco-package.json version
        uses: jossef/action-set-json-field@v2.2
        with:
          file:  Umbraco.Community.Forms.uCaptcha/wwwroot/App_Plugins/UmbracoCommunityFormsuCaptcha/umbraco-package.json
          field: version
          value: ${{ steps.gitversion.outputs.nuGetVersionV2 }}
      
      # ------------------------
      # actual builds / packages 
      # ------------------------
      - name: Restore Umbraco.Community.Forms.uCaptcha
        run: dotnet restore ./Umbraco.Community.Forms.uCaptcha/Umbraco.Community.Forms.uCaptcha.csproj

      - name: Build Umbraco.Community.Forms.uCaptcha
        run: dotnet pack ./Umbraco.Community.Forms.uCaptcha/Umbraco.Community.Forms.uCaptcha.csproj --no-restore -c ${{env.CONFIG}} --output ${{env.OUT_FOLDER}} /p:version=${{steps.gitversion.outputs.nuGetVersionV2}}

      - name: Push to GitHub Nuget Repo
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          dotnet nuget push ./build.out/Umbraco.Community.Forms.uCaptcha.${{steps.gitversion.outputs.nuGetVersionV2}}.nupkg --skip-duplicate --source https://nuget.pkg.github.com/AaronSadlerUK/index.json --api-key ${{ secrets.GH_PAT }}

      - name: Push to Nuget Repo
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          dotnet nuget push ./build.out/Umbraco.Community.Forms.uCaptcha.${{steps.gitversion.outputs.nuGetVersionV2}}.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}

      - name: Create Release
        uses: "softprops/action-gh-release@v2"
        with:
          name: ${{steps.gitversion.outputs.fullSemVer}}
          tag_name: ${{steps.gitversion.outputs.fullSemVer}}
          prerelease: true
          generate_release_notes: true
          files: |
            ./build.out/Umbraco.Community.Forms.uCaptcha.${{steps.gitversion.outputs.nuGetVersionV2}}.nupkg